<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAT REVIVE | Roblox Studio Builds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <!-- CHAT Watermark Window -->
    <section class="window window-watermark">
      <div class="window-title"></div>
      <div class="window-content">
        <img src="assets/chat.png" alt="CHAT REVIVE" class="watermark-img" loading="eager">
      </div>
    </section>

    <!-- Intro Text Window -->
    <section class="window">
      <div class="window-title"></div>
      <div class="window-content">
        <p class="intro-text">HELLO! I'M</p>
      </div>
    </section>

    <!-- Role/Bio Window -->
    <section class="window">
      <div class="window-title"></div>
      <div class="window-content">
        <p class="bio-text">I AM A <strong class="roblox-accent">ROBLOX</strong> MAP BUILDER</p>
      </div>
    </section>

    <!-- Roblox Builds Gallery Window -->
    <section class="window window-gallery">
      <div class="window-title"></div>
      <div class="window-content window-content-scroll">
        <div class="gallery-featured">
          <img src="assets/builds/build-1.png" alt="Roblox Studio build 1" class="gallery-img featured-img" loading="eager">
        </div>
        <div class="gallery-grid">
          <img src="assets/builds/build-2.png" alt="Roblox Studio build 2" class="gallery-img" loading="lazy">
          <img src="assets/builds/build-3.png" alt="Roblox Studio build 3" class="gallery-img" loading="lazy">
          <img src="assets/builds/build-4.png" alt="Roblox Studio build 4" class="gallery-img" loading="lazy">
          <img src="assets/builds/build-5.png" alt="Roblox Studio build 5" class="gallery-img" loading="lazy">
          <img src="assets/builds/build-6.png" alt="Roblox Studio build 6" class="gallery-img" loading="lazy">
          <img src="assets/builds/build-7.png" alt="Roblox Studio build 7" class="gallery-img" loading="lazy">
          <img src="assets/builds/build-8.png" alt="Roblox Studio build 8" class="gallery-img" loading="lazy">
        </div>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
